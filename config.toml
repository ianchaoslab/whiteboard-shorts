# WB_app 설정 파일
# 바꿀 수 있는 값은 모두 이 파일에서 관리한다.
# 이 파일을 고친 뒤 다시 실행하면 바뀐 값이 적용된다.

[project]
prompt_version = "v2"          # prompts/ 아래 폴더 이름. 바꾸면 새 결과 폴더를 만든다
style_preset = "whiteboard_v2" # presets/ 아래 파일 이름
cta_mode = "outro"             # outro(결론에서 홍보 소개, 기본) / none(홍보 제외) / full(원문 비중대로)

[script]
target_duration_sec = 45
min_duration_sec = 30
max_duration_sec = 60
scene_count = 6                # 기본 장면 수 (도입 1 + 설명 4 + 결론 1)
scene_count_min = 5
scene_count_max = 7

# 대본 글자 수 목표 (공백 포함) — cedar 실측 기준 (01번 1건, 2026-11-09)
#   cedar 6장면: 320자 / 51.14초 = 초당 6.26자
#   45초 중 장면 사이 여유(0.3초 × 5번 = 1.5초, 가정)를 빼면 43.5초 × 6.26 ≈ 272자 → 270자
#   샘플 1건 기준이므로 여러 샘플로 다시 확인할 것. (이전 값: 300자, 측정 전 임시값)
narration_chars_target = 270
narration_chars_basis = "cedar 실측 기준 (01번 1건)"
narration_chars_tolerance = 0.2      # 목표의 ±20%를 벗어나면 경고만 기록한다 (멈추지 않음)
narration_chars_is_provisional = false

[models]
text = "gpt-6.1-sol"
text_reasoning_effort = "medium"     # 생각 정도: low / medium(기본) / high / xhigh / max
max_output_tokens = 16000            # 한 번 호출의 출력 상한 (비용 폭주 방지)
# 아래는 이번 단계(S1~S4)에서는 쓰지 않는다. scenes.json에 기록만 한다.
image = "gpt-image-2.5-flare"
image_size = "1024x1536"
image_quality = "medium"
image_background = "opaque"         # 흰 배경 그림이라 투명 배경은 쓰지 않음
tts = "gpt-4o-mini-tts"
tts_provider = "openai"              # TTS 엔진 이름 (pipeline/tts_engines.py). 다른 서비스로 바꿀 때 여기만 변경
tts_voice = "cedar"                  # 목소리 (marin, cedar 등)
tts_instructions = "친근하고 차분한 한국어 설명 톤"   # 말투 지시 (gpt-4o-mini-tts만 지원)
tts_format = "mp3"

[video]
width = 1080
height = 1920
pad_color = "white"                  # 이미지를 9:16에 맞출 때 붙이는 여백 색
fps = 30
scene_gap_sec = 0.3                  # 장면마다 음성 뒤에 붙는 짧은 여유
draw_effect = "whiteboard"           # 드로잉 효과:
                                     #   "whiteboard" = 손으로 그리듯 나타남 (whiteboard-animator, 펜은 [whiteboard] pen으로)
                                     #   "wipe"       = 이전 방식, 위→아래로 드러나기
                                     # 한 번만 다른 효과로: python run.py --sample 01 --step s8 --effect wipe
                                     #   (이때 S9 결과는 final_wipe.mp4로 따로 저장되어 final.mp4를 덮어쓰지 않음)
reveal_sec = 1.2                     # 그림이 드러나는 시간 ("wipe" 효과용)
reveal_max_ratio = 0.3               # 장면이 짧으면 장면 길이의 30%까지만
reveal_transition = "wipedown"       # FFmpeg xfade 전환: 위에서 아래로 드러나기

# "whiteboard" 효과 설정 (pipeline/draw_whiteboard.py, whiteboard-animator 0.1.1 사용)
[whiteboard]
draw_ratio = 0.7                     # 장면 길이의 70% 동안 그림 (나머지는 완성된 그림 유지)
draw_max_sec = 6.0                   # 아무리 긴 장면도 6초 안에 다 그림
fade_sec = 0.12                      # 픽셀 하나가 나타나는 시간
min_hold_sec = 2.0                   # 다 그린 뒤 완성 그림을 최소 이만큼 보여줌 (부족하면 더 빨리 그림)
speck_max_px = 10                    # 이 픽셀 수 이하의 아주 작은 점은 그리기 전에 지움
pen = false                          # 그리는 지점을 따라가는 펜 표시 (기본 끔):
                                     # 여러 갈래가 동시에 그려질 때 펜이 따라가지 못하는 한계. 코드는 남겨둠
pen_style = { size = 170, angle_deg = 55, line_width = 4 }   # 펜 길이(px), 기울기(도), 선 굵기

# 화면 배치 (1080x1920). 그림을 줄여 위쪽에 두고, 그 아래에 그림과 겹치지 않는 자막 전용 공간을 둔다.
#   0~120     위 여백 (마지막 장면에 "AI 생성 음성" 표기)
#   120~1320  그림 800x1200 (원본 1024x1536과 같은 2:3 비율, 가운데 정렬)
#   1340~1540 자막 공간 (최대 2줄)
#   1540~1920 빈 공간 380px: 쇼츠 앱 버튼·설명이 가리는 아래쪽을 피함
[layout]
image_width = 800
image_height = 1200
image_x = 140
image_y = 120
subtitle_top = 1340
subtitle_height = 200
subtitle_max_width = 900
subtitle_max_lines = 2
font_path = "/System/Library/Fonts/AppleSDGothicNeo.ttc"
font_family = "Apple SD Gothic Neo"
subtitle_font_style = "Bold"
subtitle_font_size = 56
subtitle_line_spacing = 1.3
subtitle_color = "#111111"
notice_text = "AI 생성 음성"           # AI 음성 고지 (OpenAI 이용 정책)
notice_font_style = "Medium"
notice_font_size = 32
notice_color = "#777777"
notice_y = 28                        # 고지 글씨 그림(높이 = 글자 크기 x 2)의 위쪽 끝 → 글씨 중심 약 60px

[api]
max_validation_retries = 2           # AI 응답 형식이 틀렸을 때 다시 묻는 횟수
sdk_max_retries = 2                  # 네트워크·서버 오류 때 라이브러리가 자동으로 다시 시도하는 횟수

# 100만 토큰당 가격(USD). 2026-11-09 공식 가격표 기준 (가격이 바뀌면 고칠 것)
# 출처: https://developers.openai.com/api/docs/pricing
[prices."gpt-6.1-sol"]
input = 2.00
cached_input = 0.10
output = 10.00

[prices."gpt-6-luna"]
input = 0.10
cached_input = 0.01
output = 0.50

[prices."gpt-6-astra"]
input = 10.00
cached_input = 1.00
output = 50.00

# 이미지 모델 (100만 토큰당). gpt-image-2 / 2.5 / 2.6 공통 가격
[prices."gpt-image-2.5-flare"]
text_input = 5.00
image_input = 8.00
image_output = 30.00

# TTS (100만 토큰당). Speech API 응답에는 사용량이 없어 비용은 추정으로만 기록한다
[prices."gpt-4o-mini-tts"]
text_input = 0.60
audio_output = 12.00

# --dry-run과 비용 확인 질문에서 쓰는 예상값. 넉넉하게 잡은 추정치다.
[estimate]
s2 = { input = 2500, output = 2600 }
s3 = { input = 3100, output = 3800 }
s4 = { input = 2100, output = 2800 }
s5_image_usd = 0.0115         # 이미지 1장 예상: 실측 $0.011225 (01번 장면 1, medium 1024x1536, 2026-11-09)
s6_audio_tokens_per_sec = 20  # ⚠️ 가정: gpt-4o-mini-tts 값은 확인 못 함. 실시간 모델 기준(0.05초당 1토큰)을 빌려 씀

# 블로그 자동 수집 허락 범위 (블로그 운영자에게 자동 수집 허락을 받은 블로그만)
# 여기 있는 블로그 아이디의 글만 주소로 자동으로 가져온다. 다른 블로그는 접속하지 않고 원문 붙여넣기로 안내한다.
# 블로그를 추가하려면 허락을 받은 뒤 이 목록에 아이디를 넣는다.
[sources]
allowed_blog_ids = ["copper567", "allnewk724"]
web_cache_dir = "samples/web"        # 주소로 가져온 글 저장 (Git 제외). 같은 글은 다시 접속하지 않음 (글 하나당 1번)

[paths]
samples_dir = "samples"
samples_doc = "docs/samples.md"         # 평가용 샘플 목록 표 (없어도 동작)
outputs_dir = "outputs"
prompts_dir = "prompts"
presets_dir = "presets"
