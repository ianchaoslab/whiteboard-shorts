# S3 대본의 홍보(CTA) 처리 규칙 (v2)
# config.toml의 cta_mode 값에 따라 아래 문장이 s3_script.md에 들어간다.
# v1과 다른 점: 결론을 "~해 보세요" 같은 권유형으로 마무리

[outro]
body_promo_rule = "교재·강의·혜택 같은 홍보 내용은 body에 넣지 않는다."
outro_rule = "핵심을 한 줄로 정리한 뒤, [요약]의 promo_items에 있는 교재·강의·혜택을 자연스럽게 소개하는 행동 유도 문구(CTA)로 마무리한다. 마지막 문장은 '~확인해 보세요', '~살펴보세요' 같은 권유형으로 끝낸다. promo_items에 있는 내용만 쓰고, 원문에 없는 할인·효과·수치를 만들지 않는다. promo_items가 비어 있으면 핵심 정리와 권유형 한마디로 마무리한다."

[none]
body_promo_rule = "교재·강의·혜택 같은 홍보 내용은 넣지 않는다."
outro_rule = "핵심을 한 줄로 정리하고, '~해 보세요' 같은 권유형 한마디로 마무리한다. 교재·강의·혜택 같은 홍보 내용은 넣지 않는다."

[full]
body_promo_rule = "원문에서 홍보 내용이 차지하는 비중만큼 [요약]의 promo_items를 자연스럽게 함께 소개해도 된다. promo_items에 있는 내용만 쓴다."
outro_rule = "핵심을 한 줄로 정리한 뒤, [요약]의 promo_items를 소개하는 행동 유도 문구(CTA)로 마무리한다. 마지막 문장은 '~확인해 보세요' 같은 권유형으로 끝낸다. 원문에 없는 할인·효과·수치를 만들지 않는다."
